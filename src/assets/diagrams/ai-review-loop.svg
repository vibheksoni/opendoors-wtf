<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="A review loop for working with an AI coding agent"><title>A review loop for working with an AI coding agent</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#0b0b0c"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ededed" text-anchor="start">You stay the lead engineer</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start">The AI writes fast. Nothing ships until a person has read it and the checks pass</text><rect x="40" y="140" width="196" height="160" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="60" y="176" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#f97316" text-anchor="start">1</text><text x="138.0" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">You ask</text><text x="138.0" y="244" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">clear task</text><text x="138.0" y="267" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">known limits</text><line x1="238" y1="220" x2="274" y2="220" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="276" y="140" width="196" height="160" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="296" y="176" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#f97316" text-anchor="start">2</text><text x="374.0" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">AI drafts</text><text x="374.0" y="244" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">code and</text><text x="374.0" y="267" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">a short plan</text><line x1="474" y1="220" x2="510" y2="220" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="512" y="140" width="196" height="160" rx="10" fill="#141416" stroke="#f97316" stroke-width="1.5"/><text x="532" y="176" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#f97316" text-anchor="start">3</text><text x="610.0" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">You read the diff</text><text x="610.0" y="244" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">what changed</text><text x="610.0" y="267" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">what got removed</text><line x1="710" y1="220" x2="746" y2="220" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="748" y="140" width="196" height="160" rx="10" fill="#141416" stroke="#f97316" stroke-width="1.5"/><text x="768" y="176" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#f97316" text-anchor="start">4</text><text x="846.0" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">You push back</text><text x="846.0" y="244" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">ask why</text><text x="846.0" y="267" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">ask for a fix</text><line x1="946" y1="220" x2="982" y2="220" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><rect x="984" y="140" width="196" height="160" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="1004" y="176" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" fill="#f97316" text-anchor="start">5</text><text x="1082.0" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#ededed" text-anchor="middle">Checks pass</text><text x="1082.0" y="244" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">tests, auth</text><text x="1082.0" y="267" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">input validation</text><path d="M 866 302 C 866 370, 394 370, 394 304" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-accent)"/><text x="630" y="392" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#f97316" text-anchor="middle">not good enough yet, the AI tries again</text><text x="1160" y="392" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="end">then it ships</text></svg>
