<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-label="Layout of the .bun section inside a Bun executable"><title>Layout of the .bun section inside a Bun executable</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#0b0b0c"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ededed" text-anchor="start">Inside the .bun section</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start">Bun writes the app first and a table describing it at the very end</text><rect x="40" y="260" width="70" height="100" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="75.0" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ededed" text-anchor="middle">len</text><text x="75.0" y="332" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">8 B</text><rect x="110" y="260" width="360" height="100" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="290.0" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ededed" text-anchor="middle">JavaScript modules</text><text x="290.0" y="332" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">// @bun headers, NUL separated</text><rect x="470" y="260" width="250" height="100" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="595.0" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ededed" text-anchor="middle">Embedded data</text><text x="595.0" y="332" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">source maps, bytecode, assets</text><rect x="720" y="260" width="200" height="100" rx="10" fill="#141416" stroke="#f97316" stroke-width="1.5"/><text x="820.0" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f97316" text-anchor="middle">File table</text><text x="820.0" y="332" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">52 B per file</text><rect x="920" y="260" width="120" height="100" rx="10" fill="#141416" stroke="#f97316" stroke-width="1.5"/><text x="980.0" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f97316" text-anchor="middle">Offsets</text><text x="980.0" y="332" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">32 B</text><rect x="1040" y="260" width="120" height="100" rx="10" fill="#141416" stroke="#f97316" stroke-width="1.5"/><text x="1100.0" y="304" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#f97316" text-anchor="middle">Trailer</text><text x="1100.0" y="332" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="middle">16 B</text><path d="M 1100 256 Q 1042.5 212 985 254" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-accent)"/><text x="1042.5" y="228" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#ededed" text-anchor="middle">1. step back 32 B</text><path d="M 960 256 Q 895.0 152 830 254" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-accent)"/><text x="895.0" y="198" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#ededed" text-anchor="middle">2. Offsets points at the table</text><path d="M 800 256 Q 545.0 76 290 254" fill="none" stroke="#f97316" stroke-width="2" marker-end="url(#arrow-accent)"/><text x="545.0" y="160" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#ededed" text-anchor="middle">3. every record points at a module and its real name</text><text x="1100" y="388" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#f97316" text-anchor="middle">"\n---- Bun! ----\n"</text><text x="40" y="388" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a8a93" text-anchor="start">read it backwards: trailer, then Offsets, then the file table</text></svg>
