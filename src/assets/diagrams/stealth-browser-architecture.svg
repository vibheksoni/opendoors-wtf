<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-label="How stealth-browser-mcp connects an AI agent to a real Chrome browser"><title>How stealth-browser-mcp connects an AI agent to a real Chrome browser</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a1a1aa"/></marker><marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#f97316"/></marker></defs><rect width="100%" height="100%" rx="14" fill="#0b0b0c"/><text x="40" y="52" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#ededed" text-anchor="start">How a tool call reaches the browser</text><text x="40" y="82" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a1a1aa" text-anchor="start">stealth-browser-mcp sits between your MCP client and a real Chrome, Edge or Chromium</text><rect x="40" y="130" width="230" height="150" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="155.0" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ededed" text-anchor="middle">AI agent</text><text x="155.0" y="192" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">Claude Code</text><text x="155.0" y="215" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">Cursor or Codex</text><text x="155.0" y="238" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">any MCP client</text><rect x="420" y="130" width="330" height="150" rx="10" fill="#141416" stroke="#f97316" stroke-width="1.5"/><text x="585.0" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#f97316" text-anchor="middle">stealth-browser-mcp</text><text x="585.0" y="192" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">FastMCP server</text><text x="585.0" y="215" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">101 tools in 11 sections</text><text x="585.0" y="238" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">or 21 with --minimal</text><rect x="880" y="130" width="280" height="150" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="1020.0" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#ededed" text-anchor="middle">Real browser</text><text x="1020.0" y="192" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">Chrome, Edge or Chromium</text><text x="1020.0" y="215" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">launched through nodriver</text><text x="1020.0" y="238" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="middle">driven over CDP</text><line x1="272" y1="190" x2="418" y2="190" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><text x="345.0" y="180.0" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#8a8a93" text-anchor="middle">stdio JSON-RPC</text><line x1="418" y1="232" x2="274" y2="232" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><text x="346.0" y="254.0" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#8a8a93" text-anchor="middle">tool results</text><line x1="752" y1="190" x2="878" y2="190" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><text x="815.0" y="180.0" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#8a8a93" text-anchor="middle">CDP commands</text><line x1="878" y1="232" x2="754" y2="232" stroke="#a1a1aa" stroke-width="2" marker-end="url(#arrow)"/><text x="816.0" y="254.0" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="400" fill="#8a8a93" text-anchor="middle">page events</text><rect x="40" y="340" width="265" height="110" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="60" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ededed" text-anchor="start">stdout guard</text><text x="60" y="410" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start">keeps JSON-RPC clean</text><rect x="325" y="340" width="265" height="110" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="345" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ededed" text-anchor="start">trusted input</text><text x="345" y="410" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start">real mouse and key events</text><rect x="610" y="340" width="265" height="110" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="630" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ededed" text-anchor="start">network tools</text><text x="630" y="410" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start">requests, responses, hooks</text><rect x="895" y="340" width="265" height="110" rx="10" fill="#141416" stroke="#2b2b30" stroke-width="1.5"/><text x="915" y="380" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#ededed" text-anchor="start">element cloning</text><text x="915" y="410" font-family="ui-monospace, 'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="400" fill="#a1a1aa" text-anchor="start">styles, DOM and assets</text><text x="40" y="490" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#8a8a93" text-anchor="start">Every tool runs inside the server process so the agent only ever sends and receives JSON</text></svg>
